<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercadito Valparaíso - Pedidos</title>
    <style>
        /* Estilo general inspirado en sitios de delivery profesional */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f2f7f2; margin: 0; padding: 20px; display: flex; justify-content: center; color: #333; }
        .card { background: white; width: 100%; max-width: 400px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #e0e0e0; }
        
        /* MEDIDAS ADECUADAS: Inspiradas en referentes del sector */
        .contenedor-imagen { 
            width: 100%; 
            height: 300px; /* Altura fija para evitar desconfiguración */
            background-color: #f9f9f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
        }
        .contenedor-imagen img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* Ajusta la foto al espacio sin deformarla */
        }

        .cuerpo { padding: 20px; text-align: center; }
        h1 { color: #2d5a27; font-size: 24px; margin: 0 0 10px 0; }
        p { color: #666; font-size: 15px; line-height: 1.4; margin-bottom: 20px; }
        
        /* Botón de acción claro y directo */
        .btn-pedido { 
            display: block; 
            background-color: #25D366; 
            color: white; 
            text-decoration: none; 
            padding: 16px; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 18px; 
            box-shadow: 0 4px 6px rgba(37, 211, 102, 0.2);
            transition: 0.3s;
        }
        .btn-pedido:hover { background-color: #1ebe57; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="card">
        <div class="contenedor-imagen">
            <img src="mantequilla_mani.jpg" alt="Mantequilla de Maní Natural">
        </div>
        
        <div class="cuerpo">
            <h1>Mantequilla de Maní</h1>
            <p>Artesanal y 100% natural.<br>Reparto a domicilio en todo Valparaíso.</p>
            
            <a href="https://wa.me/569XXXXXXXX" class="btn-pedido">
                🛒 Realizar Pedido
            </a>
        </div>
    </div>

</body>
</html>
